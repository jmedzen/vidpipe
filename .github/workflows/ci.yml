name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安裝
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 前端型別檢查，以及產物與原始碼同步
        run: |
          (cd web && npm ci && npm run typecheck)
          tools/check_frontend.sh
      - name: Lint
        run: ruff check .
      - name: 測試
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 建置映像
        run: |
          BUILD="$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          docker build --build-arg VIDPIPE_BUILD="$BUILD" -t vidpipe:ci .
      - name: 映像裡有 ffmpeg、CJK 字型，且 build number 進去了
        run: |
          BUILD="$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          docker run --rm --entrypoint ffmpeg vidpipe:ci -version | head -1
          docker run --rm --entrypoint sh vidpipe:ci -c 'ls /usr/share/fonts/opentype/noto/*CJK* | head -1'
          docker run --rm vidpipe:ci version | tee /tmp/v.json
          grep -q "$BUILD" /tmp/v.json
      - name: serve 在映像裡起得來、前端產物有打包、token 有擋
        run: |
          docker run -d --name vp -e VIDPIPE_API_TOKEN=ci-token -p 127.0.0.1:8320:8320 \
            vidpipe:ci serve --host 0.0.0.0 --allow-lan --no-open
          for i in $(seq 1 30); do curl -fs localhost:8320/api/version && break; sleep 1; done
          curl -fs localhost:8320/ | grep -q '<div id="root">'
          ASSET="$(curl -fs localhost:8320/ | grep -o '/static/assets/[^"]*\.js' | head -1)"
          test -n "$ASSET" && curl -fs "localhost:8320$ASSET" -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8320/api/config)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token' localhost:8320/api/config)" = 200
          rc=0; docker run --rm vidpipe:ci serve --host 0.0.0.0 --no-open || rc=$?
          test "$rc" = 2
          docker rm -f vp
      - name: 設定頁存的設定寫得進 /data/config，權限 600，容器重啟後還在
        run: |
          docker run -d --name vp2 -e VIDPIPE_API_TOKEN=ci-token -p 127.0.0.1:8320:8320 \
            vidpipe:ci serve --host 0.0.0.0 --allow-lan --no-open
          for i in $(seq 1 30); do curl -fs localhost:8320/api/version && break; sleep 1; done
          AUTH='Authorization: Bearer ci-token'
          curl -fs -H "$AUTH" localhost:8320/api/settings -o /tmp/s.json
          grep -q '"path": "/data/config/vidpipe.json"' /tmp/s.json
          grep -q '"writable": true' /tmp/s.json
          code="$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"changes": {"tts_model": "ci-model", "tts_token": "ci-secret-token"}}' localhost:8320/api/settings)"
          test "$code" = 200
          docker exec vp2 sh -c 'test "$(stat -c %a /data/config/vidpipe.json)" = 600 && grep -q ci-model /data/config/vidpipe.json'
          docker restart vp2
          for i in $(seq 1 30); do curl -fs localhost:8320/api/version && break; sleep 1; done
          curl -fs -H "$AUTH" localhost:8320/api/settings -o /tmp/s2.json
          grep -q '"value": "ci-model"' /tmp/s2.json
          ! grep -q ci-secret-token /tmp/s2.json
          docker rm -f vp2
