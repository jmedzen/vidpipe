# vidpipe + vidgrab 一起跑的範例：cp docker-compose.example.yml docker-compose.yml，再 cp .env.example .env
# vidgrab 的映像／建置方式請看 vidgrab repo，這裡只示範兩個服務怎麼連。
services:
  vidgrab:
    build: ../vidgrab          # 或改成你自己的 image
    ports:
      - "8310:8310"            # 瀏覽器要連得到這個埠；對應到 VIDPIPE_VIDGRAB_PUBLIC_URL
  vidpipe:
    build: .
    depends_on: [vidgrab]
    env_file: .env
    environment:
      # 容器之間用服務名；瀏覽器看不到，所以 .env 另外有 VIDPIPE_VIDGRAB_PUBLIC_URL
      VIDPIPE_VIDGRAB_URL: http://vidgrab:8310
    ports:
      - "8320:8320"
    volumes:
      - ./work:/data/work
      - ./out:/data/out
    command: ["serve", "--host", "0.0.0.0", "--allow-lan", "--no-open"]
